name: Android NDK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS: "35.0.0"
  PLATFORM: "android-35"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
        # armeabi-v7a optional; Quest is arm64-only. Add back if needed:
        # abi: [arm64-v8a, armeabi-v7a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project tree
        id: root
        run: |
          set -euo pipefail
          echo "== workspace =="
          ls -la
          # Case A: already extracted Android project at root
          if [ -f gradlew ] && [ -d app ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Found project at repo root"
            exit 0
          fi
          # Case B: nested MistyTemp/
          if [ -f MistyTemp/gradlew ] && [ -d MistyTemp/app ]; then
            echo "dir=MistyTemp" >> "$GITHUB_OUTPUT"
            echo "Found project at MistyTemp/"
            exit 0
          fi
          # Case C: only the deliverable zip is in the repo — extract it
          ZIP=$(find . -maxdepth 2 -type f \( -name 'MistyTemp_SDK_Bots.zip' -o -name 'MistyTemp*.zip' \) | head -1 || true)
          if [ -n "${ZIP}" ]; then
            echo "Extracting ${ZIP}"
            unzip -qo "${ZIP}"
            if [ -f MistyTemp/gradlew ]; then
              echo "dir=MistyTemp" >> "$GITHUB_OUTPUT"
              echo "Extracted to MistyTemp/"
              exit 0
            fi
            if [ -f gradlew ]; then
              echo "dir=." >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "FATAL: could not locate Android project (gradlew + app/)"
          find . -maxdepth 3 -type f | head -80
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Accept SDK licenses + install packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          mkdir -p "${ANDROID_HOME}/licenses"
          printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_HOME}/licenses/android-sdk-license"
          printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          printf '%s\n' "d56f5187479451beabcad4263dfc32bed5f92a5f" > "${ANDROID_HOME}/licenses/android-sdk-arm-dbt-license"
          printf '%s\n' "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "${ANDROID_HOME}/licenses/google-gdk-license"
          printf '%s\n' "e9acab5b5fbb560a72cfaecce8946896ff6a2c32" > "${ANDROID_HOME}/licenses/mips-android-sysimage-license"
          printf '%s\n' "601085b94cd77f0b54ff86406957099ebe79c4d6" > "${ANDROID_HOME}/licenses/android-googletv-license"
          printf '%s\n' "8403addf88ab4874007e1c1e80a0025bf2550a37" > "${ANDROID_HOME}/licenses/intel-android-sysimage-license"
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "platforms;${PLATFORM}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Configure Gradle project
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -euo pipefail
          test -f gradlew
          test -d app
          chmod +x gradlew
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/${NDK_VERSION}"
          } > local.properties
          cp local.properties app/local.properties
          ls -la gradlew local.properties app/build.gradle

      - name: Build native shared library
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -euo pipefail
          ./gradlew :app:externalNativeBuildDebug --stacktrace --no-daemon \
            -Pandroid.injected.build.abi=${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-${{ matrix.abi }}-so
          path: |
            **/app/build/intermediates/cxx/**/*.so
            **/app/build/intermediates/cmake/**/*.so
            **/app/build/intermediates/**/*.so
          if-no-files-found: error
